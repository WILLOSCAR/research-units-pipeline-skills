[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-units-pipeline-skills"
version = "0.1.0"
description = "An end-to-end Auto Research design system built from semantic skills and a recoverable harness."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pypdf>=4.0",
  "PyYAML>=6.0",
]

[project.scripts]
rh = "tooling.product_cli:main"

[tool.setuptools]
packages = ["tooling", "tooling.quality_checks"]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
