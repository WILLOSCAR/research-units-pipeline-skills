[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-units-pipeline-skills"
version = "0.1.0"
description = "An end-to-end Auto Research design system built from semantic skills and a recoverable harness."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
rh = "rh.cli:main"

[tool.setuptools]
packages = ["rh", "rh.kernel"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
rh = ["kinds/*.yaml"]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
