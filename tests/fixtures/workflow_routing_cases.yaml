    prompt: Run a systematic review of PDF extraction methods.
    expected_workflow: evidence-review
  - id: brief-reading-path-en
    prompt: Help me understand test-time adaptation and build a reading path.
    expected_workflow: research-brief
  - id: brief-reading-path-zh
    prompt: 帮我理解扩散模型，并告诉我应该先读什么。
    expected_workflow: research-brief
  - id: brief-pdf-delivery-no-variant
    prompt: Give me a topic overview of RAG and deliver a PDF.
    expected_workflow: research-brief
  - id: idea-brainstorm-en
    prompt: Brainstorm research ideas for reliable tool-using agents.
    expected_workflow: idea-brainstorm
  - id: idea-direction-zh
    prompt: 为多模态代理找方向，并筛选几个可讨论的选题。
    expected_workflow: idea-brainstorm
