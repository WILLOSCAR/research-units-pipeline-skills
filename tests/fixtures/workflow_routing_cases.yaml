schema: workflow-routing-cases/v1
cases:
  - id: survey-literature-en
    prompt: Write a literature survey on retrieval-augmented generation.
    expected_workflow: arxiv-survey
  - id: survey-course-zh
    prompt: 为我写一篇关于强化学习的课程论文。
    expected_workflow: arxiv-survey
  - id: survey-technical-zh
    prompt: 写一份多模态智能体的技术调研报告。
    expected_workflow: arxiv-survey
  - id: survey-latex-course-en
    prompt: Write an 8-10 page course paper on RAG evaluation with a final PDF.
    expected_workflow: arxiv-survey-latex
  - id: survey-latex-report-zh
    prompt: 写一份可编译的机器人学习研讨课报告并生成 PDF。
    expected_workflow: arxiv-survey-latex
  - id: review-manuscript-en
    prompt: Review this manuscript and produce a referee report.
    expected_workflow: paper-review
  - id: review-paper-zh
    prompt: 审阅这篇论文并列出主要问题与修改建议。
    expected_workflow: paper-review
  - id: review-pdf-output-trap
    prompt: Review this paper on PDF output fidelity and return Markdown.
    expected_workflow: paper-review
