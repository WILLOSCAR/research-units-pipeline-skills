    prompt: Brainstorm ideas for improving LaTeX repair agents.
    expected_workflow: idea-brainstorm
  - id: tutorial-sources-en
    prompt: Turn these sources into a tutorial with exercises.
    expected_workflow: source-tutorial
  - id: tutorial-sources-zh
    prompt: 把这组材料整理成教程和练习。
    expected_workflow: source-tutorial
  - id: tutorial-pdf-topic-trap
    prompt: Build a tutorial about PDF parsing for new engineers.
    expected_workflow: source-tutorial
  - id: tutorial-course-notes-en
    prompt: Turn this material into course notes for a graduate seminar.
    expected_workflow: source-tutorial
  - id: explicit-survey-latex
    prompt: Use arxiv-survey-latex to write a report on RAG evaluation.
    expected_workflow: arxiv-survey-latex
  - id: pdf-lexical-default
    prompt: Analyze PDF output fidelity in multimodal models.
    expected_workflow: arxiv-survey
  - id: default-research-goal
    prompt: Investigate uncertainty calibration in language models.
    expected_workflow: arxiv-survey
