profile: gen_image
display_name: Generative image models
detect:
  all_of_groups:
    - [image, images, text-to-image, text to image, image generation, inpainting, editing, personalization, stable diffusion, sdxl]
    - [diffusion, generation, generative, dit, maskgit, vqgan, vqvae, gan, autoregressive, latent]
taxonomy:
  - name: "Foundations & Formulations"
    definition: "Core objectives, representations, and sampling or inference formulations for modern generative image models."
    children:
      - name: "Objectives and likelihood views"
        definition: "Training objectives (denoising and score matching, autoregressive factorisation, adversarial training) and what they optimise."
      - name: "Representations (pixel, latent, token)"
        definition: "How representations (pixel space, continuous latents, discrete tokens) shape compute, fidelity, and controllability."
      - name: "Sampling and efficiency"
        definition: "Samplers and solvers, guidance, distillation and consistency, and other techniques that reduce inference steps and cost."
  - name: "Model Families (Diffusion & Token-based)"
    definition: "Major model families for text-to-image generation and editing, and the trade-offs they induce in quality, speed, and controllability."
    children:
      - name: "Diffusion and latent diffusion"
        definition: "Diffusion-based generators, latent diffusion, and conditioning mechanisms (cross-attention) with implications for compute and controllability."
      - name: "Diffusion transformers and scaling"
        definition: "Transformer backbones (DiT-style) and scaling or architecture choices that affect sample quality, training stability, and inference speed."
      - name: "Token-based, autoregressive, and masked generation"
        definition: "Discrete tokenisation, autoregressive or masked token predictors, and decoding strategies, compared against diffusion generators."
  - name: "Control, Editing & Conditioning"
    definition: "Mechanisms to steer generation: structured conditioning, layout and geometry signals, inpainting and editing, and personalisation."
    children:
      - name: "Structured controls"
        definition: "Conditioning with geometry, layout, depth, pose, or segmentation, and how control signals propagate through the backbone."
      - name: "Instruction-guided editing"
        definition: "Editing and inversion methods, text-based editing, and failure modes such as identity drift or over-editing."
      - name: "Personalisation and tuning"
        definition: "Fine-tuning and parameter-efficient adaptation (LoRA-like) for subject-driven personalisation with few examples."
  - name: "Evaluation, Safety & Provenance"
    definition: "How models are evaluated, common benchmark pitfalls, and concerns around bias, misuse, and provenance or watermarking."
    children:
      - name: "Metrics and human evaluation"
        definition: "Automatic metrics (distribution and semantic alignment) and human evaluation protocols; gaps between metrics and perception."
      - name: "Robustness and failure modes"
        definition: "Prompt sensitivity, compositional failures, bias and toxicity, and reliability under distribution shift."
      - name: "Provenance and safeguards"
        definition: "Watermarking and provenance, dataset governance, and mitigation strategies for misuse and deepfakes."
