profile: rag_evaluation
display_name: Retrieval-augmented generation evaluation
detect:
  all_of_groups:
    - [retrieval-augmented generation, retrieval augmented generation, rag evaluation]
    - [evaluation, evaluate, evaluated, benchmark, metric]
taxonomy:
  - name: "Evaluation Targets & Failure Decomposition"
    definition: "Separate what is being measured before interpreting an end-to-end RAG score: retrieval quality, evidence coverage, answer faithfulness, and source attribution expose different failure mechanisms."
    children:
      - name: "Retrieval quality and evidence coverage"
        definition: "Whether retrieval finds, ranks, and preserves sufficient evidence for the query: recall, context coverage, chunking, top-k, and reranking sensitivity."
      - name: "Generation faithfulness and source attribution"
        definition: "Whether answer claims are supported by retrieved evidence and whether citations or attributions identify the sources that justify those claims."
  - name: "Evaluation Protocols & Measurement Validity"
    definition: "How datasets, tasks, metrics, evaluators, and comparison conditions combine into an interpretable protocol rather than an isolated score."
    children:
      - name: "Dataset, task, and metric design"
        definition: "Corpus and query provenance, task coverage and difficulty, reference-answer assumptions, metric decomposition, aggregation, and uncertainty reporting."
      - name: "Automated evaluators and human validation"
        definition: "Rule-based, learned, and LLM-based evaluators compared against human judgements: agreement, construct validity, calibration, bias, reproducibility, and cost."
  - name: "Robustness, Transfer & Operational Validity"
    definition: "Whether evaluation conclusions survive changes to queries, corpora, retrieval components, budgets, domains, and deployment constraints."
    children:
      - name: "Sensitivity, adaptation, and query or corpus shift"
        definition: "Perturbations to queries and corpora, retriever or reranker replacement, adaptation after feedback, variance, and failure consistency under controlled budgets."
      - name: "Domain transfer, trustworthiness, and deployment"
        definition: "Evaluator transfer across domains and operational settings: fairness, contradictions, provenance, privacy, latency, cost, maintenance, and deployed reliability."
