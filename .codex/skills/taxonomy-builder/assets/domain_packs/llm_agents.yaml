profile: llm_agents
display_name: Tool-using LLM agents
detect:
  all_of_groups:
    - [agent, agents]
    - [llm, language model, gpt, chatgpt]
taxonomy:
  - name: "Foundations & Interfaces"
    definition: "Problem formulation and interface design for tool-using LLM agents: the agent loop, action spaces, and the tool/environment boundary that constrains reliability."
    children:
      - name: "Agent loop and action spaces"
        definition: "Agent loop abstractions (observe → decide → act), action representations, environment and tool modelling, and failure-recovery assumptions."
      - name: "Tool interfaces and orchestration"
        definition: "Calling tools and APIs (function calling), tool selection and routing, permissions and sandboxing, and orchestration patterns that affect correctness and safety."
  - name: "Core Components (Planning + Memory)"
    definition: "Core capability levers for long-horizon agents: planning and reasoning for action selection, and memory and retrieval for grounded state."
    children:
      - name: "Planning and reasoning loops"
        definition: "Decomposition, plan search and verification, robustness under partial observability and tool failures; how planning interleaves with tool calls."
      - name: "Memory and retrieval (RAG)"
        definition: "Working versus long-term memory, retrieval policies, state summarisation, grounding strategies, and how memory interacts with planning and tool use."
  - name: "Learning, Adaptation & Coordination"
    definition: "How agents improve with experience (reflection, RL, prompt or program optimisation) and how several agents coordinate to divide labour or verify outputs."
    children:
      - name: "Self-improvement and adaptation"
        definition: "Reflection, critique, and revision loops; preference optimisation; evaluation-driven prompt or program tuning; stability and reward-hacking risks."
      - name: "Multi-agent coordination"
        definition: "Role specialisation, communication protocols, debate and verification patterns, aggregation, and coordination failure modes."
  - name: "Evaluation & Risks"
    definition: "What is measured and why it is hard: benchmarks and protocols for tool use and long-horizon tasks, plus risk surfaces and governance constraints for deployed agents."
    children:
      - name: "Benchmarks and evaluation protocols"
        definition: "Task suites, datasets, metrics, human evaluation, leakage and reproducibility concerns, and how evaluation choices bias conclusions."
      - name: "Safety, security, and governance"
        definition: "Threat models (prompt injection, data exfiltration, tool abuse), guardrails and monitoring, and governance controls for deployed agents."
